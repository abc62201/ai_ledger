plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ai.ledger'
    compileSdk 33
    buildFeatures {
        buildConfig true  // <--- 加上这一行！
    }
    defaultConfig {
        applicationId "com.ai.ledger"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def props = new Properties()
        props.load(new FileInputStream(rootProject.file("local.properties")))
        buildConfigField "String", "GITEE_FULL_URL", "\"${props['giteeFullUrl']}\""
    }
    aaptOptions {
        // 禁止压缩这些后缀的文件，确保 Vosk 能直接读取
        noCompress "tflite", "mdl", "txt", "json", "wav"
        // 或者简单粗暴一点，不压缩 assets 下的任何文件：
        // noCompress ""
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.alphacephei:vosk-android:0.3.32'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}